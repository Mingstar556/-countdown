<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Countdown 毕业 · 2027年1月9日</title>
  <meta name="description" content="Countdown 毕业 - 倒计时至 2027年1月9日">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body class="dark-theme">
  <!-- Hardware-Accelerated Ambient Light Layer -->
  <div class="ambient-layer" aria-hidden="true">
    <div class="light-mesh"></div>
    <div class="interactive-glow" id="mouseGlow"></div>
  </div>

  <!-- Non-Stoppable Native HTML5 Loop Audio Engine (song.mp3) -->
  <audio id="bgmAudio" src="song.mp3" autoplay loop preload="auto" playsinline></audio>

  <main class="page-container">
    <!-- Top Navigation Bar -->
    <header class="top-nav">
      <!-- Non-Stoppable Background Music Indicator -->
      <div id="musicPill" class="music-pill playing" aria-label="Background music is playing" title="Background Music (Continuous Loop)">
        <span class="music-icon-wrap">
          <span class="music-bars" id="musicBars" aria-hidden="true">
            <span class="bar bar-1"></span>
            <span class="bar bar-2"></span>
            <span class="bar bar-3"></span>
          </span>
        </span>
        <span class="music-text" id="musicText">🎵 BGM Playing</span>
      </div>
      
      <div class="nav-controls">
        <button id="themeToggle" class="icon-btn" title="Toggle Appearance" aria-label="Toggle light or dark theme">
          <svg class="icon sun-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <button id="fullscreenToggle" class="icon-btn" title="Toggle Fullscreen" aria-label="Toggle fullscreen mode">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <div class="content-wrapper">
      <!-- Title & Header -->
      <section class="hero-section">
        <div class="subtitle-tag">
          <span class="cap-emoji">🎓</span>
          <span class="target-date-label">目标设定：2027年1月9日 00:00:00</span>
        </div>
        <h1 class="main-title">Countdown 毕业</h1>
        <p class="tagline">静待花开，奔赴下一场山海</p>
      </section>

      <!-- Apple-Style Countdown Stage -->
      <section class="countdown-stage" aria-label="毕业倒计时">
        <div class="clock-grid">
          <!-- Days -->
          <div class="unit-card" data-unit="days">
            <div class="card-inner">
              <div class="digit-box">
                <span class="digit-value" id="val-days">--</span>
              </div>
              <span class="unit-label">日</span>
            </div>
          </div>

          <div class="time-separator">:</div>

          <!-- Hours -->
          <div class="unit-card" data-unit="hours">
            <div class="card-inner">
              <div class="digit-box">
                <span class="digit-value" id="val-hours">--</span>
              </div>
              <span class="unit-label">小时</span>
            </div>
          </div>

          <div class="time-separator">:</div>

          <!-- Minutes -->
          <div class="unit-card" data-unit="minutes">
            <div class="card-inner">
              <div class="digit-box">
                <span class="digit-value" id="val-minutes">--</span>
              </div>
              <span class="unit-label">分</span>
            </div>
          </div>

          <div class="time-separator">:</div>

          <!-- Seconds -->
          <div class="unit-card" data-unit="seconds">
            <div class="card-inner">
              <div class="digit-box">
                <span class="digit-value" id="val-seconds">--</span>
              </div>
              <span class="unit-label">秒</span>
            </div>
          </div>
        </div>

        <!-- Format Display: dd日,hh小时,mm分,ss秒 -->
        <div class="format-pill-wrapper">
          <div class="format-pill" id="copyFormatBtn" title="点击复制当前倒计时文本" role="button" tabindex="0">
            <span class="pill-indicator">格式</span>
            <span class="format-string" id="formattedCountdownString">--日,--小时,--分,--秒</span>
            <span class="copy-hint">
              <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span class="copy-text">复制</span>
            </span>
          </div>
          <span class="copied-toast" id="copiedToast">已复制到剪贴板</span>
        </div>
      </section>

      <!-- Time Metrics & Journey Bar -->
      <section class="journey-dashboard">
        <div class="progress-container">
          <div class="progress-header">
            <span class="progress-title">时光进度</span>
            <span class="progress-percent" id="progressPercent">0.0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-fill" id="progressBar"></div>
          </div>
          <div class="progress-footer">
            <span id="journeyStartLabel">起航：今日</span>
            <span id="journeyTargetLabel">终点：2027年1月9日</span>
          </div>
        </div>

        <!-- Sub-metrics Grid -->
        <div class="metrics-grid">
          <div class="metric-card">
            <span class="metric-num" id="totalHoursRemaining">-</span>
            <span class="metric-name">总计剩余小时</span>
          </div>
          <div class="metric-card">
            <span class="metric-num" id="totalMinutesRemaining">-</span>
            <span class="metric-name">总计剩余分钟</span>
          </div>
          <div class="metric-card">
            <span class="metric-num" id="totalSecondsRemaining">-</span>
            <span class="metric-name">总计剩余秒数</span>
          </div>
        </div>
      </section>
    </div>

    <!-- Minimalist Footer -->
    <footer class="page-footer">
      <p class="footer-note">距离愿望实现，每一秒都在靠近 · 2027.01.09</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
